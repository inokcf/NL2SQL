logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3307
  user: didilili
  password: dili123
  database: meta

db_dw:
  host: localhost
  port: 3307
  user: didilili
  password: dili123
  database: dw

qdrant:
  host: localhost
  port: 6335
  embedding_size: 1024

embedding:
  host: localhost
  port: 8082
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9201
  index_name: data_agent

llm:
  model_name: deepseek-v4-flash
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://api.deepseek.com

auth:
  # 生产环境务必通过 AUTH_SECRET_KEY 环境变量覆盖
  secret_key: ${oc.env:AUTH_SECRET_KEY,dev-only-secret-change-me-please-32-bytes}
  algorithm: HS256
  # 登录 Token 有效期，默认 7 天
  token_expire_minutes: 10080

redis:
  host: localhost
  port: 6380
  password: dili123
  db: 0
  key_prefix: nl2sql
  # 短期会话记忆的存活时间，每次追加消息都会刷新；默认保留 7 天，便于回看近期会话
  session_ttl_seconds: 604800
  # 每个会话最多保留最近多少条消息，超出后自动裁剪最旧消息
  max_messages: 20

memory:
  # 是否启用长期向量记忆
  long_term_enabled: true
  # 问题改写和记忆抽取时最多参考最近多少条会话消息
  history_prompt_messages: 10
  # 长期记忆语义检索返回条数
  long_term_top_k: 5
  # 长期记忆相似度阈值，低于该分数的记忆不会注入提示词
  long_term_score_threshold: 0.55
  # 是否调用 LLM 从每轮问数中抽取可复用的长期偏好/口径
  extraction_enabled: true
  # 单条长期记忆最大字符数，避免异常长文本污染向量库
  max_memory_chars: 500
